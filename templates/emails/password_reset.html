<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
        <tr>
            <td align="center">
                <table width="500" cellpadding="0" cellspacing="0" 
                       style="background:#ffffff; padding:40px; border-radius:10px; text-align:center;">

                    <tr>
                        <td>
                            <h2 style="margin-bottom:20px;">Reset your password</h2>
                        </td>
                    </tr>

                    <tr>
                        <td style="color:#555; font-size:16px; line-height:24px;">
                            Hello,<br><br>
                            We received a request to reset your password for your 
                            <strong>Videoflix</strong> account.
                            <br><br>
                            Click the button below to set a new password:
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:30px 0;">
                            <a href="{{ reset_link }}" 
                               style="background-color:#5b4bff;
                                      color:#ffffff;
                                      padding:12px 25px;
                                      text-decoration:none;
                                      border-radius:6px;
                                      display:inline-block;
                                      font-weight:bold;">
                                Reset password
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td style="color:#888; font-size:14px;">
                            This link is valid for 24 hours.<br><br>
                            If you did not request a password reset, please ignore this email.
                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:30px; font-size:14px; color:#555;">
                            Best regards,<br>
                            The Videoflix Team
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
