<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Confirm your email</title>
</head>
<body style="margin:0; padding:40px; background-color:#f2f2f2; font-family: Arial, sans-serif;">

    <div style="max-width:600px; margin:0 auto; background-color:#f2f2f2;">

        <!-- LOGO -->
        <div style="text-align:center; margin-bottom:30px;">
            <div style="font-size:28px; font-weight:bold; color:#5A3BFF;">
                &gt; VIDEOFLIX
            </div>
        </div>

        <!-- CONTENT -->
        <div style="color:#333; font-size:14px; line-height:1.6;">

            <p>
                Dear <span style="color:#2F3AEF;">[User's Name]</span>,
            </p>

            <p>
                Thank you for registering with
                <span style="color:#2F3AEF;">Videoflix</span>.
                To complete your registration and verify your email address,
                please click the link below:
            </p>

            <!-- BUTTON -->
            <div style="margin:30px 0;">
                <a href="{{ activation_link }}"
                   style="
                        display:inline-block;
                        padding:12px 30px;
                        background-color:#2F3AEF;
                        color:#ffffff;
                        text-decoration:none;
                        border-radius:30px;
                        font-weight:bold;
                        font-size:14px;
                   ">
                    Activate account
                </a>
            </div>

            <p style="color:#555;">
                If you did not create an account with us, please disregard this email.
            </p>

            <p style="margin-top:30px;">
                Best regards,<br>
                Your Videoflix Team.
            </p>

        </div>

    </div>

</body>
</html>
